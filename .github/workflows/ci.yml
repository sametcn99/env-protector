name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Biome lint & format check
        run: npx @biomejs/biome check .

      - name: Typecheck & compile tests
        run: npm run compile-tests

      - name: Build production bundle
        run: npm run package

      - name: Package VSIX
        run: npx --yes @vscode/vsce package --no-dependencies -o env-protector.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: env-protector-vsix
          path: env-protector.vsix
          retention-days: 7

  test:
    name: Extension Tests (${{ matrix.os }})
    needs: lint-and-build
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests (Linux via xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test

      - name: Run tests (Windows / macOS)
        if: runner.os != 'Linux'
        run: npm test
